[pytest]
# Pytest configuration for Garmin MCP testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
pythonpath = src

# Minimum version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -m "not e2e"

# Markers for different test types
markers =
    unit: Unit tests (fast, isolated, mocked)
    integration: Integration tests (FastMCP integration with mocked API)
    e2e: End-to-end tests (require real Garmin credentials and API access) - SKIPPED BY DEFAULT
    slow: Tests that take a long time to run

# e2e tests are deselected by addopts above. They hit the live Garmin API with
# the developer's own account, so a bare `pytest` run must not depend on
# working credentials, network, or that account's write permissions — this file
# has always documented that intent, but nothing implemented it, so `pytest`
# collected tests/test_garmin.py (an upstream manual script whose test_*
# functions take arguments pytest resolves as fixtures) and errored.
# To run them anyway: pytest -m e2e  (a CLI -m overrides the one in addopts)

# Asyncio configuration
asyncio_mode = auto

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=garmin_mcp --cov-report=html --cov-report=term

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
